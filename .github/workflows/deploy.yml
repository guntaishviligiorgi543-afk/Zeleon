name: "Deploy Zeleon to GitHub Pages"

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test sitemap generation
        run: npm run test:seo

      - name: Test public pages and authentication protections
        run: npm run test:public-safety

      - name: Install prerender browser
        run: npx playwright install --with-deps chromium

      - name: Build Angular application
        run: npm run build -- --configuration production --base-href /

      - name: Verify prerendered Pages artifact and browser navigation
        run: npm run test:seo:local

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/zeleon/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
