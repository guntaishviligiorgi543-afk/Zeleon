<header>
  <div class="infoslideWrapper">
    <div class="infoslideAnimation">
      <div class="slideGroup">
        <p>FREE SHIPPING ON ORDERS $40</p>
        <p>FREE SHIPPING ON ORDERS $40</p>
        <p>FREE SHIPPING ON ORDERS $40</p>
      </div>

      <div class="slideGroup" aria-hidden="true">
        <p>FREE SHIPPING ON ORDERS $40</p>
        <p>FREE SHIPPING ON ORDERS $40</p>
        <p>FREE SHIPPING ON ORDERS $40</p>
      </div>
    </div>
  </div>

  <div class="headerContainer" [class.is-scrolled]="isScrolled()">
    <a class="logo" routerLink="/"> <span>Zeleon</span></a>
    <div class="headerIcons">
      @if (auth.isAuthenticated()) {
        <a class="profile-link" routerLink="/profile" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }" ariaCurrentWhenActive="page">Profile</a>
        <button class="auth-session-button" type="button" aria-label="Log out" [disabled]="signingOut()"
          [attr.aria-busy]="signingOut()" (click)="logout()">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M0 0h24v24H0z" fill="none" />
            <g fill="currentColor">
              <path d="M8.514 20h-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4v2h-4v12h4z" />
              <path d="m13.842 17.385l1.42-1.408l-3.92-3.953h9.144a1 1 0 1 0 0-2h-9.162l3.98-3.947l-1.408-1.42l-6.391 6.337z" />
            </g>
          </svg>
        </button>
      } @else {
        <a class="auth-session-link" routerLink="/login" aria-label="Login">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 4L17 4C19.2091 4 21 5.7909 21 8L21 16C21 18.2091 19.2091 20 17 20L15 20M13.1214 12L3 12M8.0607 6.5L13.7266 11.6314C13.9454 11.8296 13.9454 12.1704 13.7266 12.3686L8.0607 17.5" />
          </svg>
        </a>
      }
      @if (authError()) {
        <span class="auth-error" role="alert">{{ authError() }}</span>
      }
      <button
        class="cart-toggle"
        type="button"
        aria-label="Open cart"
        aria-controls="cart-sidebar"
        [attr.aria-expanded]="cartSidebar.opened()"
        (click)="cartSidebar.open()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
          <path d="M0 0h24v24H0z" fill="none" />
          <path
            fill="currentColor"
            d="M8 18a2 2 0 1 0 0 4a2 2 0 1 0 0-4m9 0a2 2 0 1 0 0 4a2 2 0 1 0 0-4M6 15c0 .55.45 1 1 1h12c.46 0 .86-.31.97-.76l2-8c.07-.3 0-.62-.18-.86S21.31 6 21 6H8V3c0-.55-.45-1-1-1H2v2h4zm2-7h11.72l-1.5 6H8z"
          />
        </svg>
        <span class="cart-count"></span>
      </button>
    </div>
    <app-burger-menu
      [links]="navigationLinks"
      [authenticated]="!!auth.user()"
      [signingOut]="signingOut()"
      [authError]="authError()"
      (logoutRequested)="logout()"
      (cartRequested)="cartSidebar.open()"
    ></app-burger-menu>
    <app-cart-sidebar #cartSidebar></app-cart-sidebar>
  </div>
</header>
