<button #menuToggle class="menu-toggle" type="button" aria-label="Open navigation menu"
  aria-controls="zeleon-mobile-menu" [attr.aria-expanded]="opened()" (click)="open()">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
</button>

<dialog #menuDialog id="zeleon-mobile-menu" class="menu-dialog" aria-labelledby="mobile-menu-title"
  (cancel)="cancel($event)" (close)="finishClose()" (click)="outside($event)">
  <div class="menu-panel">
    <div class="menu-heading">
      <span id="mobile-menu-title">ZELEON</span>
      <button class="menu-close" type="button" aria-label="Close navigation menu" autofocus (click)="close()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
      </button>
    </div>
    <nav aria-label="Mobile navigation">
      @for (link of links(); track link.path) {
        <a [routerLink]="link.path" routerLinkActive="current" [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page" (click)="close()">{{ link.label }}<span aria-hidden="true">↗</span></a>
      }
    </nav>
    <div class="menu-actions">
      <a class="login-link" [routerLink]="authenticated() ? '/profile' : '/login'" (click)="close()">{{ authenticated() ? 'Profile' : 'Login' }}</a>
      @if (authenticated()) {
        <button class="logout-link" type="button" [disabled]="signingOut()" (click)="close(); logoutRequested.emit()">{{ signingOut() ? 'Signing out…' : 'Logout' }}</button>
      }
      @if (authError()) { <p role="alert">{{ authError() }}</p> }
      <button class="cart-link" type="button" (click)="openCart()">View Cart
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h2l3 12h11l2-8H6M9 20h.01M18 20h.01" /></svg>
      </button>
    </div>
  </div>
</dialog>
